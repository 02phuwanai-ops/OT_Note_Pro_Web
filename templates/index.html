<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        OT Note Pro Falcon
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css">

    <link
        rel="manifest"
        href="/static/manifest.json">

</head>

<body>

    <!-- ====================================== -->
    <!-- Header -->
    <!-- ====================================== -->

<div class="header">

    <div>

        <h1>⚡ OT Note Pro Falcon </h1>

        <p>
            Maxky Edition
        </p>

        <p>
        👤 User : {{ employee_id }}
        </p>


        <p>
        🔐 Role : {{ role }}
        </p>

    </div>

    <div>

        {% if role == "admin" %}

        <button
            class="blue"
            onclick="window.location='/users'">

            👤 User Management

        </button>

        {% endif %}

        <button
            class="red"
            onclick="window.location='/logout'">

            Logout
            

        </button>

    </div>

</div>

    <!-- ====================================== -->
    <!-- Main Card -->
    <!-- ====================================== -->

    {% if role != "admin" %}

    <div class="card">

        <h2>📩 Paste SMS</h2>

        <textarea
            id="sms"
            placeholder="วาง SMS ที่นี่..."></textarea>

        <button
            class="blue"
            onclick="parseSMS()">

            🔍 Parse SMS

        </button>

        <h2>⚙ OT Information</h2>

        <div class="form-grid">

            <div class="field">

                <label>Ticket</label>

                <input>

            </div>

            <div class="field">

                <label>Circuit</label>

                <input>

            </div>

            <div class="field">

                <label>Fault Date</label>

                <input>

            </div>

            <div class="field">

                <label>Start Time</label>

                <input onkeyup="calculateOT()">

            </div>

            <div class="field">

                <label>Finish Time</label>

                <input onkeyup="calculateOT()">

            </div>

            <div class="field">

                <label>OT Hours</label>

                <input readonly>

            </div>

            <div class="field full">

                <label>Detail</label>

                <textarea
                    id="detail"
                    rows="2"
                    placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>

            </div>
        
        </div>

        <!-- ====================================== -->
        <!-- Buttons -->
        <!-- ====================================== -->

        <div class="button-bar">

            <button
                class="green"
                onclick="saveOT()">

                💾 Save

            </button>

            <button
                class="orange"
                onclick="updateOT()">

                ✏ Update

            </button>

            <button
                class="blue"
                onclick="exportTXT()">

                📄 Export TXT

            </button>

            <button
                class="gray"
                onclick="clearForm()">

                🧹 Clear

            </button>

        </div>

        <!-- ====================================== -->
        <!-- Records -->
        <!-- ====================================== -->

        <div class="records-header">

            <h2 class="table-title">

                📋 Recent OT Records

            </h2>

            <div class="ot-summary" id="totalHours">

                🟢 0.00 hrs

            </div>

        </div>

        <div class="table-wrapper mobile-table">

            <table>

                <thead>

                    <tr>

                        <th>Ticket</th>
                        <th>Circuit</th>
                        <th>Fault Date</th>
                        <th>Start</th>
                        <th>Finish</th>
                        <th>Hour</th>
                        <th>Detail</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="records">

                </tbody>

            </table>

        </div>

    </div>
    
    {% endif %}

    <!-- ========================= -->
    <!-- JavaScript -->
    <!-- ========================= -->
<script>

// ======================================
// Parse SMS
// ======================================

function parseSMS(){

    let sms = document.getElementById("sms").value;


    fetch("/parse",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:"sms="+encodeURIComponent(sms)

    })


    .then(response=>response.json())


    .then(data=>{

    console.log("PARSE RESULT:", data);


    if(!data){

        alert("Parser ไม่ได้ส่งข้อมูลกลับมา");

        return;

    }


    let inputs=document.querySelectorAll("input");


        inputs[0].value=data.ticket || "";

        inputs[1].value=data.circuit || "";

        inputs[2].value=data.fault_date || "";

        inputs[3].value=data.start_time || "";

        inputs[4].value=data.finish_time || "";


        document.getElementById("detail").value="";


        calculateOT();


    });

}


// ======================================
// Save
// ======================================

function saveOT(){

    let inputs=document.querySelectorAll("input");

    let detail=document.getElementById("detail");

    let data={

        ticket:inputs[0].value,

        circuit:inputs[1].value,

        fault_date:inputs[2].value,

        start_time:inputs[3].value,

        finish_time:inputs[4].value,

        hours:inputs[5].value,

        description:detail.value

    };

    fetch("/save",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    })

    .then(response=>response.json())

    .then(result=>{

        if(result.success){

            alert("บันทึก OT สำเร็จ");

            loadRecords();

            clearForm();

        }else{

            alert("Ticket นี้มีอยู่แล้ว");

        }

    })

    .catch(error=>{

        console.log(error);

        alert("เกิดข้อผิดพลาด");

    });

}



// ======================================
// Update
// ======================================

function updateOT(){

    let inputs=document.querySelectorAll("input");

    let detail=document.getElementById("detail");

    let data={

        ticket:inputs[0].value,

        circuit:inputs[1].value,

        fault_date:inputs[2].value,

        start_time:inputs[3].value,

        finish_time:inputs[4].value,

        hours:inputs[5].value,

        description:detail.value

    };

    fetch("/update",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    })

    .then(response=>response.json())

    .then(result=>{

        if(result.success){

            alert("อัปเดตสำเร็จ");

            loadRecords();

        }else{

            alert("อัปเดตไม่สำเร็จ");

        }

    });

}



// ======================================
// Calculate OT
// ======================================

function calculateOT(){

    let inputs=document.querySelectorAll("input");

    let start=inputs[3].value;

    let finish=inputs[4].value;

    if(start=="" || finish==""){

        inputs[5].value="";

        return;

    }

    // รองรับ :  .  ,  ;
    let s = start.split(/[:.,;]/);

    let f = finish.split(/[:.,;]/);

    let startMinute=
        Number(s[0])*60+
        Number(s[1]);

    let finishMinute=
        Number(f[0])*60+
        Number(f[1]);

    if(finishMinute<startMinute){

        finishMinute+=24*60;

    }

    let hour=(finishMinute-startMinute)/60;

    inputs[5].value=hour.toFixed(2);

}



// ======================================
// Clear
// ======================================

function clearForm(){

    document.getElementById("sms").value="";

    document.querySelectorAll("input").forEach(input=>{

        input.value="";

    });

    document.getElementById("detail").value="";

}

</script>

<script>

// ======================================
// Load Records
// ======================================

window.onload = function(){

    loadRecords();

};

function loadRecords(){

    fetch("/records")

    .then(response=>response.json())

    .then(data=>{

        let table=document.getElementById("records");

        table.innerHTML="";

        fetch("/summary")

        .then(response => response.json())

        .then(data => {

            document.getElementById("totalHours").innerHTML =
                `🟢 ${Number(data.hours).toFixed(2)} hrs`;

        });

        data.forEach(row=>{

            console.log(row);

            let tr=document.createElement("tr");
            

            // เมื่อคลิกแถว
            tr.onclick=function(){

                let inputs=document.querySelectorAll("input");

                inputs[0].value=row[0] || "";
                inputs[1].value=row[1] || "";
                inputs[2].value=row[2] || "";
                inputs[3].value=row[3] || "";
                inputs[4].value=row[4] || "";
                inputs[5].value=row[5] || "";

                document.getElementById("detail").value = row[6] || "";

            };

            // แสดงเฉพาะ 7 คอลัมน์
            const columns = [
                row[0], // Ticket
                row[1], // Circuit
                row[2], // Fault Date
                row[3], // Start
                row[4], // Finish
                row[5], // Hour
                row[6]  // Detail
            ];

            columns.forEach((col, index) => {

                let td = document.createElement("td");

                // คอลัมน์แรก = Ticket
                if(index === 0){

                    if(col === null || col === undefined || String(col).trim() === ""){

                        td.innerHTML =
                        '<span class="ticket-badge ticket-manual">Manual</span>';

                    }else{

                        let ticket = String(col).trim();

                        if(ticket.startsWith("TT")){

                            td.innerHTML =
                            `<span class="ticket-badge ticket-normal"
                            title="${ticket}">
                            ${ticket.slice(-6)}
                            </span>`;

                        }
                        else if(ticket.startsWith("INC")){

                            td.innerHTML =
                            `<span class="ticket-badge ticket-inc"
                            title="${ticket}">
                            ${ticket.slice(-6)}
                            </span>`;

                        }
                        else{

                            td.innerHTML =
                            `<span class="ticket-badge ticket-install"
                            title="${ticket}">
                            ${ticket}
                            </span>`;

                        }

                    }

                }else{

                    td.textContent = (col ?? "");

                }

                tr.appendChild(td);

            });

            // Action
            let action=document.createElement("td");

            action.innerHTML=`
                <button
                    class="red"
                    onclick="event.stopPropagation();deleteOT(${row[7]})">
                    🗑 Delete
                </button>
            `;

            tr.appendChild(action);

            table.appendChild(tr);

        });

    });

}



// ======================================
// Delete
// ======================================

function deleteOT(id){

    if(!confirm("ต้องการลบรายการนี้ ?")){
        return;
    }

    fetch("/delete",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            id:id
        })

    })

    .then(r=>r.json())

    .then(result=>{

        if(result.success){

            alert("ลบข้อมูลเรียบร้อย");

            clearForm();

            loadRecords();

        }else{

            alert("ไม่สามารถลบข้อมูลได้");

        }

    });

}


// โหลดค่าที่เคยเลือกไว้

window.addEventListener(
"load",
function(){

    let dark =
    localStorage.getItem("darkMode");


    if(dark === "true"){

        document.body.classList.add("dark");

    }

});

// ======================================
// Export TXT
// ======================================

function exportTXT(){

    window.location="/export";

}

</script>

</body>

</html>
