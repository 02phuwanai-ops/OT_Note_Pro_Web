<!DOCTYPE html>
<html>

<head>

    <title>User Management</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="card">

<h1>
👤 User Management
</h1>

<p>
Administrator
</p>

<hr>

<h3>
ผู้ใช้ทั้งหมด
</h3>

<table
border="1"
width="100%"
>

<thead>

<tr>

<th>Employee ID</th>

<th>Role</th>

<th>Action</th>

</tr>

</thead>

<tbody id="users">

</tbody>

</table>

<br>

<button
class="blue"
onclick="window.location='/dashboard'">

⬅ Dashboard

</button>

</div>

<script>

loadUsers();

function loadUsers(){

    fetch("/user_list")

    .then(r=>r.json())

    .then(data=>{

        let tb=document.getElementById("users");

        tb.innerHTML="";

        data.forEach(u=>{

            tb.innerHTML+=`

<tr>

<td>${u.employee_id}</td>

<td>${u.role}</td>

<td>

<button
onclick="resetPassword('${u.employee_id}')">
🔑 Reset
</button>

<button
class="red"
onclick="deleteUser('${u.employee_id}')">
🗑 Delete
</button>

</td>

</tr>

`;

        });

    });

}

function deleteUser(employee_id){

    if(!confirm("ต้องการลบ User นี้ ?")){

        return;

    }

    fetch("/delete_user/" + employee_id,{

        method:"POST"

    })

    .then(r=>r.json())

    .then(result=>{

        if(result.success){

            alert("ลบ User สำเร็จ");

            loadUsers();

        }
        else{

            alert("ไม่สามารถลบ User ได้");

        }

    });

}

function resetPassword(employee_id){

    let pass = prompt(

        "New Password"

    );

    if(!pass){

        return;

    }

    fetch("/reset_password",{

        method:"POST",

        headers:{

            "Content-Type":"application/json"

        },

        body:JSON.stringify({

            employee_id:employee_id,

            password:pass

        })

    })

    .then(r=>r.json())

    .then(result=>{

        if(result.success){

            alert("Reset Password สำเร็จ");

        }

        else{

            alert("Reset ไม่สำเร็จ");

        }

    });

}

</script>

</body>

</html>
